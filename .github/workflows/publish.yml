name: Publish Quarto site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render website
        run: quarto render
      - name: Render slides
        run: quarto render slides
      - name: Stage slides in website output
        run: |
          mkdir -p _site/slides
          cp -R slides/_site/. _site/slides/
      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
